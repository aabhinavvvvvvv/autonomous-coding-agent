[project]
name = "agent-platform"
version = "0.1.0"
description = "Autonomous coding agent with sandboxed execution and evidence-based evaluation."
readme = "README.md"
requires-python = ">=3.12"
# Runtime dependencies are added in the milestone that first needs them.
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_platform"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes: unused imports/variables, undefined names
    "I",       # import sorting
    "N",       # naming conventions
    "UP",      # modern Python syntax
    "B",       # bugbear: likely bugs and design problems
    "S",       # bandit: security issues (shell=True, hardcoded secrets, ...)
    "SIM",     # simplifications
    "RUF",     # ruff-specific checks
]

[tool.ruff.lint.per-file-ignores]
# pytest uses bare `assert` by design.
"tests/**" = ["S101"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
